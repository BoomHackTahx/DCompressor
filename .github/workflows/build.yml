name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libarchive-dev qt6-base-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure with vcpkg
        shell: pwsh
        run: >-
          cmake -S . -B build
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Bundle Windows application
        shell: pwsh
        run: |
          $dist = Join-Path $PWD "dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $exe = Join-Path $PWD "build/Release/dcompressor.exe"
          $windeployqt = Join-Path $env:VCPKG_ROOT "installed/x64-windows/tools/Qt6/bin/windeployqt.exe"
          & $windeployqt --release --no-translations --dir $dist $exe
          Copy-Item $exe $dist
          Get-ChildItem (Join-Path $env:VCPKG_ROOT "installed/x64-windows/bin/*.dll") |
            Copy-Item -Destination $dist
          Compress-Archive -Path (Join-Path $dist "*") -DestinationPath (Join-Path $PWD "DCompressor-windows-x64.zip")
      - uses: actions/upload-artifact@v4
        with:
          name: DCompressor-windows-x64
          path: DCompressor-windows-x64.zip
          if-no-files-found: error